name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            target_triple: x86_64-unknown-linux-gnu
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            package_args: ""
            suffix: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target_triple: aarch64-unknown-linux-gnu
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            package_args: ""
            suffix: ""
          - runner: macos-15-intel
            platform: macos-x86_64
            target_triple: x86_64-apple-darwin
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            package_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            suffix: ""
          - runner: macos-15
            platform: macos-arm64
            target_triple: aarch64-apple-darwin
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            package_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            suffix: ""
          - runner: windows-2025
            platform: windows-x86_64
            target_triple: x86_64-pc-windows-msvc
            cmake_args: -A x64
            package_args: -A x64
            suffix: ".exe"
          - runner: windows-11-arm
            platform: windows-arm64
            target_triple: aarch64-pc-windows-msvc
            cmake_args: -A ARM64
            package_args: -A ARM64
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) url=https://get.nexte.st/0.9.116/x86_64-unknown-linux-gnu.tar.gz ;;
            Linux-ARM64) url=https://get.nexte.st/0.9.116/aarch64-unknown-linux-gnu.tar.gz ;;
            macOS-*) url=https://get.nexte.st/0.9.116/universal-apple-darwin.tar.gz ;;
            Windows-X64) url=https://get.nexte.st/0.9.116/x86_64-pc-windows-msvc.tar.gz ;;
            Windows-ARM64) url=https://get.nexte.st/0.9.116/aarch64-pc-windows-msvc.tar.gz ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -LsSf "$url" | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          cargo fetch --locked --manifest-path tracy-nextest-capture/crates/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tracy-nextest-capture/tests/fixture/Cargo.toml

      - name: Configure
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON \
              -DTRACY_NATIVE_TIMER_FALLBACK=ON \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest${{ matrix.suffix }} \
              ${{ matrix.cmake_args }}; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Build
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build --config Release --parallel 2

      - name: Test
        env:
          CARGO_NET_OFFLINE: "true"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Exercise patched sys source-build mode
        if: matrix.platform == 'linux-x86_64'
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ github.workspace }}/sys-source-target
        shell: bash
        run: |
          cargo test --locked \
            --manifest-path tracy-embedded-capture/rust/tracy-client-sys/Cargo.toml \
            --no-default-features --features enable,manual-lifetime,timer-fallback \
            --test ordinary-client

      - name: Upload in-process capture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tracy-nextest-diagnostics-${{ matrix.platform }}
          path: |
            build/nextest-in-process-*/**/*.tracy
            build/nextest-in-process-*/*.{log,txt}
          if-no-files-found: ignore
          retention-days: 7

      - name: Install, smoke-test, and name release binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix stage
          mkdir -p dist
          query="stage/bin/tracy-query${{ matrix.suffix }}"
          "$query" --version | grep 'tracy-query 0.5.0 (Tracy parser 0.13.1)'
          cmake -E copy "$query" "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"
          test -s "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"

      - name: Configure clean embedded-native package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B package-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTRACY_QUERY_FULLY_STATIC=OFF \
            -DTRACY_QUERY_STATIC_MSVC_RUNTIME=OFF \
            -DTRACY_EMBEDDED_NATIVE_PACKAGE=ON \
            -DTRACY_EMBEDDED_NATIVE_PLATFORM=${{ matrix.platform }} \
            -DTRACY_EMBEDDED_NATIVE_TARGET_TRIPLE=${{ matrix.target_triple }} \
            ${{ matrix.package_args }}

      - name: Build and verify embedded-native package
        shell: bash
        run: |
          set -euo pipefail
          cmake --build package-build --config Release \
            --target tracy-embedded-native-package --parallel 2
          bundle_dir="$PWD/package-build/tracy-embedded-native-package/tracy-embedded-native"
          cmake -DBUNDLE_DIR="$bundle_dir" \
            -DEXPECTED_TARGET=${{ matrix.target_triple }} \
            -P cmake/VerifyTracyEmbeddedNative.cmake
          case "${{ matrix.platform }}" in
            linux-*)
              if [[ "${{ matrix.platform }}" = *x86_64 ]]; then machine='x86-64'; else machine='ARM aarch64'; fi
              for archive in "$bundle_dir"/lib/*.a; do
                member=$(ar t "$archive" | head -1)
                rm -rf architecture-check && mkdir architecture-check
                (cd architecture-check && ar x "$archive" "$member")
                file "architecture-check/$member" | grep "$machine"
              done
              ;;
            macos-*)
              if [[ "${{ matrix.platform }}" = *x86_64 ]]; then arch=x86_64; else arch=arm64; fi
              for archive in "$bundle_dir"/lib/*.a; do lipo -archs "$archive" | grep -w "$arch"; done
              ;;
            windows-*)
              if [[ "${{ matrix.platform }}" = *x86_64 ]]; then machine=x64; else machine=ARM64; fi
              vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
              vsroot=$("$vswhere" -latest -property installationPath | tr -d '\r')
              dumpbin=$(find "$vsroot/VC/Tools/MSVC" -path '*/bin/Hostx64/x64/dumpbin.exe' | sort -V | tail -1)
              test -x "$dumpbin"
              for archive in "$bundle_dir"/lib/*.lib; do
                "$dumpbin" /headers "$archive" | grep -i "$machine"
                directives=$("$dumpbin" /directives "$archive")
                grep -qi 'DEFAULTLIB:MSVCRT' <<<"$directives"
                if grep -qi 'DEFAULTLIB:LIBCMT' <<<"$directives"; then
                  echo "static CRT contamination in $archive" >&2
                  exit 1
                fi
              done
              ;;
          esac

      - name: Link native consumer from extracted package only
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$PWD/package-build/tracy-embedded-native-package/tracy-embedded-native"
          cmake -S tracy-embedded-capture/tests/package-consumer -B package-consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRACY_EMBEDDED_NATIVE_DIR="$bundle_dir" \
            ${{ matrix.package_args }}
          cmake --build package-consumer-build --config Release --parallel 2
          if [[ "${{ runner.os }}" = Windows ]]; then
            package-consumer-build/Release/package-consumer.exe
          else
            package-consumer-build/package-consumer
          fi

      - name: Build and validate Rust captures from package with CMake unavailable
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$PWD/package-build/tracy-embedded-native-package/tracy-embedded-native"
          query="$PWD/stage/bin/tracy-query${{ matrix.suffix }}"
          rm -rf prebuilt-consumer-target
          python3 tracy-embedded-capture/examples/rust-embedded-capture/run_demo.py \
            --mode normal --output "$PWD/prebuilt-normal.tracy" --query "$query" \
            --target-dir "$PWD/prebuilt-consumer-target" --prebuilt-dir "$bundle_dir"
          python3 tracy-embedded-capture/examples/rust-embedded-capture/run_demo.py \
            --mode unwind-panic --output "$PWD/prebuilt-panic.tracy" --query "$query" \
            --target-dir "$PWD/prebuilt-consumer-target" --prebuilt-dir "$bundle_dir" --release

      - name: Exercise explicit prebuilt rejection diagnostics
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          python3 tracy-embedded-capture/tests/test_prebuilt_rejections.py \
            --bundle "$PWD/package-build/tracy-embedded-native-package/tracy-embedded-native" \
            --example-manifest tracy-embedded-capture/examples/rust-embedded-capture/Cargo.toml \
            --sys-manifest tracy-embedded-capture/rust/tracy-client-sys/Cargo.toml \
            --target-dir "$PWD/prebuilt-rejection-target"

      - name: Reject static MSVC CRT in prebuilt mode
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$PWD/package-build/tracy-embedded-native-package/tracy-embedded-native"
          set +e
          output=$(TRACY_CLIENT_SYS_PREBUILT_DIR="$bundle_dir" \
            CMAKE=cmake-must-not-run-in-prebuilt-mode \
            RUSTFLAGS='-C target-feature=+crt-static' \
            CARGO_TARGET_DIR="$PWD/prebuilt-crt-rejection-target" \
            cargo check --locked --offline \
              --manifest-path tracy-embedded-capture/rust/tracy-client-sys/Cargo.toml \
              --no-default-features --features embedded-capture 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'requires the dynamic MSVC CRT' <<<"$output"

      - name: Upload uncompressed query binary
        uses: actions/upload-artifact@v7
        with:
          name: tracy-query-${{ matrix.platform }}
          path: dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}
          archive: false
          if-no-files-found: error

      - name: Upload compressed embedded-native bundle
        uses: actions/upload-artifact@v7
        with:
          name: tracy-embedded-native-${{ matrix.platform }}
          path: package-build/dist/tracy-embedded-native-${{ matrix.platform }}.*
          archive: false
          if-no-files-found: error

  sanitizers:
    name: embedded capture sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          curl -LsSf https://get.nexte.st/0.9.116/linux | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'
      - name: Configure ASan and UBSan
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build-sanitize -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DTRACY_QUERY_FULLY_STATIC=OFF \
              -DTRACY_NATIVE_TIMER_FALLBACK=ON \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest \
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path tracy-nextest-capture/crates/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tracy-nextest-capture/tests/fixture/Cargo.toml
      - name: Build tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build-sanitize --parallel 2
      - name: Run embedded capture tests repeatedly
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TRACY_QUERY_NATIVE_SANITIZER_LIBS: asan,ubsan
          CARGO_NET_OFFLINE: "true"
        run: |
          for attempt in 1 2 3; do
            ctest --test-dir build-sanitize \
              -R 'embedded-transport-|embedded-capture-|nextest-in-process-(failure|always)' \
              --output-on-failure
          done

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-and-test, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download release products
        uses: actions/download-artifact@v8
        with:
          pattern: tracy-*
          path: release
          merge-multiple: true

      - name: Verify release files and exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.5.0"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list -n1 v0.5.0)" = "${GITHUB_SHA}"
          .github/scripts/verify-release-files.sh release
          (cd release && sha256sum tracy-* > SHA256SUMS)
          test "$(wc -l < release/SHA256SUMS)" -eq 12

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          `tracy-extensions` 0.5.0 provides `tracy-query` and relocatable embedded-capture native libraries for Tracy Profiler 0.13.1/protocol 76.

          Six query executables and six `tracy-embedded-native` bundles cover Linux, macOS, and Windows on x86-64 and ARM64. Native bundles use profile `embedded-capture-v1`; Windows query executables retain the static MSVC runtime while Windows native libraries use the dynamic MSVC CRT required by ordinary Rust MSVC targets.

          Verify downloads with `SHA256SUMS`. See `README.md` and `tracy-embedded-capture/docs/rust.md` for the CMake-free Rust workflow and compatibility limits.
          EOF
          gh release create "${GITHUB_REF_NAME}" release/tracy-* release/SHA256SUMS \
            --verify-tag \
            --title "tracy-extensions 0.5.0" \
            --notes-file release-notes.md
