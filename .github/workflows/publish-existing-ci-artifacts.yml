name: Publish existing CI artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      artifact_run_id:
        description: Successful tagged CI run containing the release binaries
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish GitHub release from CI artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Verify producing run and tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v0.5.0
          tag_sha=$(git rev-parse HEAD)
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$tag_sha"
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = "$tag_sha"
          test "$(jq -r .head_branch <<<"$run_json")" = "$RELEASE_TAG"

      - name: Download release products
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: tracy-*
          path: release
          merge-multiple: true
          skip-decompress: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/verify-release-files.sh release
          (cd release && sha256sum tracy-* > SHA256SUMS)
          test "$(wc -l < release/SHA256SUMS)" -eq 12

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v0.5.0"
          cat > release-notes.md <<'EOF'
          `tracy-extensions` 0.5.0 provides `tracy-query` and relocatable embedded-capture native libraries for Tracy Profiler 0.13.1/protocol 76.

          Six query executables and six `tracy-embedded-native` bundles cover Linux, macOS, and Windows on x86-64 and ARM64. Native bundles use profile `embedded-capture-v1`; Windows query executables retain the static MSVC runtime while Windows native libraries use the dynamic MSVC CRT required by ordinary Rust MSVC targets.

          Verify downloads with `SHA256SUMS`. See `README.md` and `tracy-embedded-capture/docs/rust.md` for the CMake-free Rust workflow and compatibility limits.
          EOF
          gh release create "$RELEASE_TAG" release/tracy-* release/SHA256SUMS \
            --verify-tag \
            --title "tracy-extensions 0.5.0" \
            --notes-file release-notes.md
