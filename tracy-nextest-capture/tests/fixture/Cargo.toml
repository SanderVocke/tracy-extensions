[package]
name = "tracy-nextest-in-process-fixture"
version = "0.6.0"
edition = "2021"
publish = false

[dependencies]
tracy-nextest-capture = { path = "../../crates/tracy-nextest-capture" }
tracy-client = { version = "=0.18.4", default-features = false, features = ["enable", "manual-lifetime"] }
tracy-client-sys = { version = "=0.28.0", default-features = false, features = ["embedded-capture"] }
log = "0.4"
tracing = "0.1"

[patch.crates-io]
tracy-client-sys = { path = "../../../tracy-embedded-capture/rust/tracy-client-sys" }

[profile.dev]
panic = "unwind"
[profile.release]
panic = "unwind"
